  db.set.rem=db.set.rem||{f:{on:0,every:120,tone:''},v:{on:0,every:120,tone:''}};
  ['f','v'].forEach(k=>{if(!db.set.rem[k].every)db.set.rem[k].every=120;delete db.set.rem[k].times});
  if(!db.set.vtypes)db.set.vtypes=['دبابة','جامبو','براد','أخرى'];
  if(db.set.cold==null)db.set.cold=1;
  /* non-destructive: لا تفرض حدود حرارة على وحدات موجودة */
  if(!db.set.rng)db.set.rng=1;
  db.set.units.forEach(u=>{if(typeof u.min!=='number')u.min=-18;if(typeof u.max!=='number')u.max=-12});
  if(!db.set.vlim||typeof db.set.vlim.min!=='number')db.set.vlim={min:-18,max:-12};
  db.prods.forEach(p=>{if(!p.min)p.min='-18';if(!p.max)p.max='-12'});
  db.set.suppliers=db.set.suppliers||['مورد 1','مورد 2','مورد 3'];

  if(!db.set.rs){
    db.set.rs=1;
    [['qmanager','مدير الجودة','QMgr'],['driver','المندوب','Driver'],['user1','user1','User1']].forEach(([u,n,r])=>{
      if(!db.users.some(x=>x.u===u))db.users.push({u,n,r,p:H('1234'),mustChange:true});
    });
  }
  db.batches.filter(b=>!b.rid).forEach(b=>{
    const id='r'+b.id;b.rid=id;b.date=b.date||(b.cr||'').slice(0,10);
    db.rcv.push({id,cr:b.cr||new Date().toISOString(),by:b.by||'',s:b.s||0,no:'IN-'+(b.date||'').replace(/-/g,'')+'-'+String(db.rcv.length+1).padStart(3,'0'),date:b.date,wh:b.wh||'',rt:b.rt||'',status:b.status,sup:b.sup||'',note:''});
  });
  db.ops.filter(o=>!o.mid).forEach(o=>{
    const id='m'+o.id,b=db.batches.find(x=>x.no===o.batch);o.mid=id;o.prod=o.prod||(b?b.prod:'');
    db.mvs.push({id,cr:o.cr||new Date().toISOString(),by:o.by||'',s:o.s||0,no:'MV-'+(o.date||'').replace(/-/g,'')+'-'+String(db.mvs.length+1).padStart(3,'0'),date:o.date||(o.cr||'').slice(0,10),type:o.type,to:o.to||'',note:o.note||''});
  });
  /* GC tombstones > 30 days */
  if(db._deleted&&typeof db._deleted==='object'){
    const cut=Date.now()-30*864e5;
    for(const bucket of Object.keys(db._deleted)){
      const m=db._deleted[bucket];if(!m||typeof m!=='object')continue;
      for(const id of Object.keys(m)){const t=+new Date(m[id]);if(!t||t<cut)delete m[id]}
      if(!Object.keys(m).length)delete db._deleted[bucket];
    }
  }
  db.set.docs=db.set.docs||{};
}
mig();

/* ─────── 7) Batch merge logic ─────── */
function lotUnion(p,r){
  const st=x=>String(x._updatedAt||x.cr||''),w=st(r)>=st(p)?r:p,l=w===r?p:r;
  const cx=b=>b.contrib&&b.contrib.length?b.contrib:[{rid:b.rid,by:b.by,bu:b.bu,qty:b.qty,q2:b.q2,kg:b.kg,note:b.note,rt:b.rt,wh:b.wh,sup:b.sup,date:b.date}];
  const rmc=new Set([...(p.rmc||[]),...(r.rmc||[])]),m=new Map();
  cx(w).forEach(c=>c.rid&&m.set(c.rid,c));
  cx(l).forEach(c=>{if(c.rid&&!m.has(c.rid)&&!rmc.has(c.rid))m.set(c.rid,c)});
  if(m.size<=1&&!w.contrib&&!l.contrib)return w;
  const cs=[...m.values()],out={...w,contrib:cs};
  if(rmc.size)out.rmc=[...rmc];
  ['qty','q2','kg'].forEach(k=>out[k]=String(+cs.reduce((a,y)=>a+(+y[k]||0),0).toFixed(3)));
  return out;
}
function lotsByNo(list,deleted){
  const by=new Map();
  for(const b of list){const e=by.get(b.no);if(!e){by.set(b.no,b);continue}
    const base=String(e.cr||'')<=String(b.cr||'')?e:b,oth=base===e?b:e;
    const m=new Map(),cx=x=>x.contrib&&x.contrib.length?x.contrib:[{rid:x.rid,by:x.by,bu:x.bu,qty:x.qty,q2:x.q2,kg:x.kg,note:x.note,rt:x.rt,wh:x.wh,sup:x.sup,date:x.date}];
    cx(base).forEach(c=>c.rid&&m.set(c.rid,c));
    cx(oth).forEach(c=>{if(c.rid&&!m.has(c.rid))m.set(c.rid,c)});
    const cs=[...m.values()],out={...base,_updatedAt:new Date().toISOString()};
    if(cs.length>1){out.contrib=cs;['qty','q2','kg'].forEach(k=>out[k]=String(+cs.reduce((a,y)=>a+(+y[k]||0),0).toFixed(3)))}
    if(oth.status==='محجوز'&&out.status!=='محجوز')out.status='محجوز';
    deleted.batches=deleted.batches||{};deleted.batches[String(oth.id)]=new Date().toISOString();
    by.set(b.no,out);
  }
  return [...by.values()];
}
function lotPrune(b,rc){if(!b.contrib)return b;const cs=b.contrib.filter(c=>!c.rid||rc.has(String(c.rid)));if(cs.length===b.contrib.length)return b;if(!cs.length)return null;const out={...b,contrib:cs};['qty','q2','kg'].forEach(k=>out[k]=String(+cs.reduce((a,y)=>a+(+y[k]||0),0).toFixed(3)));if(!cs.some(c=>c.rid===out.rid))out.rid=cs[0].rid;return out}

/* ─────── 8) Cloud merge ─────── */
function cloudMerge(local,remote){
  if(!remote||typeof remote!=='object')return local;
  const merged={...remote,...local};
  const deleted={};
  for(const[bucket,ids]of Object.entries(remote._deleted||{}))deleted[bucket]={...(ids||{})};
  for(const[bucket,ids]of Object.entries(local._deleted||{}))deleted[bucket]={...(deleted[bucket]||{}),...(ids||{})};
  merged._deleted=deleted;
  const keys=[...new Set([...Object.keys(remote),...Object.keys(local)])];
  for(const k of keys){
    if(!Array.isArray(local[k])&&!Array.isArray(remote[k]))continue;
    const a=Array.isArray(remote[k])?remote[k]:[],b=Array.isArray(local[k])?local[k]:[];
    const map=new Map();
    for(const r of [...a,...b]){
      if(!r||r.id==null)continue;
      const id=String(r.id),tomb=(deleted[k]||{})[id];
      if(tomb)continue;
      const prev=map.get(id);
      if(k==='batches'&&prev)map.set(id,lotUnion(prev,r));
      else if(!prev||(r._updatedAt||r.cr||'')>=(prev._updatedAt||prev.cr||''))map.set(id,r);
    }
    merged[k]=[...map.values()];
  }
  if(Array.isArray(merged.batches)&&Array.isArray(merged.rcv)){const rc=new Set(merged.rcv.map(x=>String(x.id)));merged.batches=merged.batches.map(b=>lotPrune(b,rc)).filter(Boolean)}
  if(Array.isArray(merged.batches)){merged._deleted=merged._deleted||deleted;merged.batches=lotsByNo(merged.batches,merged._deleted)}
  if(Array.isArray(local.users)||Array.isArray(remote.users)){
    const map=new Map(),ud=deleted.users||{};
    for(const u of [...(remote.users||[]),...(local.users||[])]){const id=String(u.u||'');if(ud[id]&&String(ud[id])>=String(u._updatedAt||''))continue;const prev=map.get(id);if(!prev||(u._updatedAt||'')>=(prev._updatedAt||''))map.set(id,u)}
    merged.users=[...map.values()];
  }
  if(local.set||remote.set)merged.set=local._settingsUpdatedAt&&local._settingsUpdatedAt>(remote._settingsUpdatedAt||'')?(local.set||remote.set):(remote.set||local.set);
  if(merged.set)merged.set={...merged.set,syncUrl:(local.set&&local.set.syncUrl)||merged.set.syncUrl||'',syncToken:(local.set&&local.set.syncToken)||merged.set.syncToken||''};
  return merged;
}

async function syncOnce(c){
  const headers={'Content-Type':'application/json','X-Sync-Token':c.token};
  const get=await fx(c.url+'/api/state',{method:'GET',headers});

  const post=await fx(c.url+'/api/sync',{method:'POST',headers:{...headers,'If-Match':String(db._rev||'0')},body:JSON.stringify({state:pubState(db)})});
  if(post.status===409){const fresh=await post.json();db=cloudMerge(db,fresh.state||{});if(fresh.rev!=null)db._rev=String(fresh.rev);save();sy.again=1;return}
  if(!post.ok){const e=new Error('POST '+post.status);e.status=post.status;throw e}
  const result=await post.json();
  if(result.state)db=cloudMerge(db,result.state);
  if(result.rev!=null)db._rev=String(result.rev);

  const fileInput=$('#f_'+cfg.f.find(f=>f[2]==='img')?.[0]+'_file');
  if(fileInput){
    fileInput.onchange=async e=>{

async function saveRecord(k,id){
  if(!can(id?'edit':'add'))return toast('غير مصرح',1);
  const cfg=M[k];
  const r=id?db[k].find(x=>x.id===id):{id:uuid(),cr:new Date().toISOString(),by:me.u,s:0};

  const data={};
  for(const [field,,type] of cfg.f){
    if(type==='img')continue;
    const el=$('#f_'+field);

function delRecord(k,id){

/* ─────── 23) Image handling ─────── */
const IDB=(()=>{
  let p;
  const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('fg_blobs',1);r.onupgradeneeded=()=>r.result.createObjectStore('blobs');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=mode=>open().then(d=>d.transaction('blobs',mode).objectStore('blobs'));
  return{
    put:(id,b)=>tx('readwrite').then(s=>new Promise((res,rej)=>{const q=s.put(b,id);q.onsuccess=()=>res(1);q.onerror=()=>rej(q.error)})),
    get:id=>tx('readonly').then(s=>new Promise((res,rej)=>{const q=s.get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})),
    del:id=>tx('readwrite').then(s=>new Promise((res,rej)=>{const q=s.delete(id);q.onsuccess=()=>res(1);q.onerror=()=>rej(q.error)}))
  };
})();
async function compressImg(file,maxSide=1024,q=0.8){
  const bmp=await createImageBitmap(file);
  const sc=Math.min(1,maxSide/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return new Promise(res=>c.toBlob(res,'image/jpeg',q));
}
async function viewImg(id){
  let url=id;
  if(!id.startsWith('blob:')&&!id.startsWith('data:')){const b=await IDB.get(id);if(b)url=URL.createObjectURL(b)}
  $('#md').innerHTML=`<div class="sh" style="max-width:90vw"><div class="row"><h3 style="margin:0">صورة</h3><button class="lk" onclick="cl()">${ico('x')}</button></div><img src="${url}" style="width:100%;border-radius:10px;margin-top:10px"></div>`;
  $('#md').className='on';
}
async function delImg(id){
  if(!confirm('حذف الصورة؟'))return;
  try{await IDB.del(id)}catch(e){}
  const el=[...document.querySelectorAll('img[data-img="'+id+'"],img[src="'+id+'"]')][0];
  if(el)el.closest('.thw')?.remove();
}

/* ─────── 24) Session idle lock ─────── */
let _idleT;
function resetIdle(){clearTimeout(_idleT);_idleT=setTimeout(()=>{if(me&&document.visibilityState!=='hidden'){try{logout();toast('تم قفل الجلسة',1)}catch(_){}}},30*60*1000)}
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));

try{
  const _si=Storage.prototype.setItem;
  Storage.prototype.setItem=function(k,v){try{return _si.call(this,k,v)}catch(e){if(e&&(e.name==='QuotaExceededError'||e.code===22))toast('الذاكرة ممتلئة — صدّر نسخة احتياطية',1);throw e}};
}catch(_){}
