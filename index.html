function rcvApply(h,H,rows){
  const raw=h?rraw(h):[];
  for(const b of raw){const cs=cbs(b),own=cs.find(c=>c.rid===h.id)||{qty:b.qty},shared=cs.length>1,used=db.ops.some(o=>o.batch===b.no)||db.recall.some(o=>o.batch===b.no),x=rows.find(y=>y.b===b.id);
    if(!x){if(shared?bal(b)-(+own.qty)<0:used)return{err:'لا يمكن حذف التشغيلة '+b.no+': عليها حركات أو استدعاء'}}
    else{if(x.no!==b.no&&(used||shared))return{err:'لا يمكن تغيير رقم تشغيلة عليها حركات أو مشتركة: '+b.no};if(bal(b)+(+x.qty-(+own.qty))<0)return{err:'الكمية أقل من المصروف للتشغيلة '+b.no}}}
  if(h&&h.status==='محجوز'&&H.status!=='محجوز'&&raw.some(b=>b.status==='محجوز'))H.status='محجوز';
  const oldSt=h?h.status:null,now=new Date().toISOString();let rec=h,held=0;
  if(h)Object.assign(h,H,{s:0,_updatedAt:now});else{rec={id:uid(),cr:now,_updatedAt:now,by:me.n,bu:me.u,s:0,...H};db.rcv.push(rec)}
  raw.forEach(b=>{if(!rows.some(y=>y.b===b.id))rcRemove(b,rec.id)});
  rows.forEach(x=>{
    let o=x.b?db.batches.find(b=>b.id===x.b):null;
    if(o&&o.no!==x.no){rcRemove(o,rec.id);o=null}
    const p=db.prods.find(q=>q.n===x.prod),tb=o||db.batches.find(b=>b.no===x.no);
    const c={rid:rec.id,by:rec.by||me.n,bu:rec.bu||me.u,qty:x.qty,q2:x.q2,kg:x.kg,note:x.note,rt:H.rt,wh:H.wh,sup:H.sup,date:H.date};
    const d={sup:H.sup||(tb?tb.sup:''),prod:x.prod,pd:x.pd,no:x.no,qty:x.qty,q2:x.q2,kg:x.kg,note:x.note,rt:H.rt,wh:H.wh,date:H.date,rid:rec.id,ex:p&&+p.shelf>0?addd(x.pd,+p.shelf):(tb?tb.ex:''),status:tb&&H.status===oldSt?tb.status:H.status};
    if(tb){
      const cs=cbs(tb).map(y=>({...y})),i=cs.findIndex(y=>y.rid===rec.id);if(i>=0)cs[i]={...cs[i],...c};else cs.push(c);
      tb.rmc=(tb.rmc||[]).filter(r=>r!==rec.id);if(!tb.rmc.length)delete tb.rmc;
      if(cs.length===1){Object.assign(tb,d,{s:0,_updatedAt:now});delete tb.contrib}
      else{tb.contrib=cs;['qty','q2','kg'].forEach(k=>tb[k]=sumC(cs,k));tb.s=0;tb._updatedAt=now;if(!cs.some(y=>y.rid===tb.rid))tb.rid=cs[0].rid;if(brc(+H.rt,lim(p))&&tb.status!=='محجوز'){tb.status='محجوز';held++}}
    }else{const nb={id:uid(),cr:now,_updatedAt:now,by:me.n,bu:me.u,s:0,...d};if(brc(+H.rt,lim(p))){nb.status='محجوز';held++}db.batches.push(nb)}
  });
  return{rec,held}
}

function relSave(id){if(me.r!=='Admin')return toast('الإفراج الاستثنائي من صلاحية المدير فقط',1);const b=db.batches.find(x=>x.id===id),why=($('#rw').value||'').trim();if(!b||b.status!=='محجوز')return toast('التشغيلة ليست محجوزة',1);if(why.length<3)return toast('اكتب سبب الإفراج',1);const now=new Date().toISOString();b.status='مقبول';b.rel={by:me.n,bu:me.u,at:now,why};b._updatedAt=now;b.s=0;db.rcv.forEach(h=>{if(h.status==='محجوز'&&rraw(h).some(x=>x.id===b.id)&&!rraw(h).some(x=>x.status==='محجوز')){h.status='مقبول';h._updatedAt=now;h.s=0}});aud('إفراج استثنائي','batches',{no:b.no,why});save();cl();R();sync();toast('تم الإفراج عن التشغيلة '+b.no)}

let aiH=[],aiBusy=0;
function insights(){const t=td(),o=[],n30=addd(t,30),w=addd(t,-7);
  const outT=db.temps.filter(r=>sOf('temps',r)==='خارج الحد'&&String(r.cr||'').slice(0,10)>=w);
  if(outT.length)o.push({x:`${outT.length} قراءة حرارة خارج الحد خلال آخر 7 أيام (الوحدات: ${[...new Set(outT.map(r=>r.unit))].slice(0,5).join('، ')}).`,r:'راجع أداء وحدات التبريد المذكورة وسجّل إجراءً تصحيحياً.'});
  const un=db.temps.filter(r=>sOf('temps',r)==='خارج الحد'&&r.ack===0).length;
  if(un)o.push({x:`${un} قراءة خارج الحد لم يتم الإقرار بها.`,r:'يجب الإقرار بها ومراجعة السبب.'});
  const nc=db.ncr.filter(r=>/مفتوح|جديد/.test(String(r.status||''))).length;
  if(nc)o.push({x:`${nc} حالة عدم مطابقة مفتوحة.`,r:'حدّد مسؤولاً وموعداً لإغلاق كل حالة.'});
  const live=db.batches.filter(b=>bal(b)>0);
  const exp=live.filter(b=>b.ex&&b.ex<t),soon=live.filter(b=>b.ex&&b.ex>=t&&b.ex<=n30);
  if(exp.length)o.push({x:`${exp.length} تشغيلة منتهية الصلاحية وما زال لها رصيد (${exp.slice(0,4).map(b=>b.no).join('، ')}).`,r:'اعزلها فوراً وافتح حالة عدم مطابقة قبل أي صرف.'});
  if(soon.length)o.push({x:`${soon.length} تشغيلة تنتهي خلال 30 يوماً (${soon.slice(0,4).map(b=>b.no).join('، ')}).`,r:'أعطها أولوية الصرف (FEFO).'});
  const held=db.batches.filter(b=>b.status==='محجوز').length;
  if(held)o.push({x:`${held} تشغيلة محجوزة.`,r:'أكمل الفحص واتخذ قرار الإفراج أو الرفض.'});
  const neg=db.batches.filter(b=>bal(b)<0).length;
  if(neg)o.push({x:`${neg} تشغيلة رصيدها سالب.`,r:'راجع حركات الصرف والإدخال لهذه التشغيلات.'});
  const cp=db.complaints.filter(r=>/مفتوح|جديد/.test(String(r.status||''))).length;
  if(cp)o.push({x:`${cp} شكوى عميل مفتوحة.`,r:'تابع الرد والإجراء التصحيحي.'});
  return o}
function aiCtx(){const t=td(),row=r=>Object.entries(r).filter(([k,v])=>!['id','cr','s','by','bu','_updatedAt','nc','ck','mk','sq','sn','contrib','rmc','rid','mid'].includes(k)&&typeof v!=='object'&&v!==''&&v!=null).slice(0,9).map(([k,v])=>k+':'+String(v).slice(0,60)).join(', ');
  const last=(k,n)=>db[k].slice(-n).map(row).join('\n')||'—';
  const c=[`المستخدم: ${me.n} (${RL[me.r]}) — تاريخ اليوم: ${t} — نطاق البيانات: ${priv()?'كل بيانات الشركة':'بيانات هذا المستخدم فقط'}`,
   'عدد السجلات: '+['temps','ncr','returns','complaints','batches','rcv','mvs','capa','recall'].map(k=>k+'='+db[k].length).join(', '),
   'تنبيهات آلية:\n'+(insights().map(i=>'- '+i.x).join('\n')||'لا توجد'),
   'أحدث التشغيلات:\n'+db.batches.slice(-30).map(b=>`${b.no}|${b.prod}|صلاحية:${b.ex||'-'}|حالة:${b.status}|رصيد:${bal(b)}`).join('\n'),
   'أحدث عدم المطابقة:\n'+last('ncr',10),'أحدث الشكاوى:\n'+last('complaints',8),'أحدث المرتجعات:\n'+last('returns',8),'أحدث الإجراءات التصحيحية:\n'+last('capa',6),
   'أحدث قراءات الحرارة خارج الحد:\n'+db.temps.filter(r=>sOf('temps',r)==='خارج الحد').slice(-10).map(row).join('\n')];
  return c.join('\n\n').slice(0,14000)}
const aiBub=(m)=>`<div class="card" style="${m.role==='user'?'background:var(--c2,#eef)':''}"><small>${m.role==='user'?'أنت':'🤖 المساعد'}</small><div>${esc(m.content).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}</div></div>`;
function aiOpen(){const ins=insights();$('#md').innerHTML=`<div class="sh"><div class="row"><b>🤖 المساعد الذكي</b><button class="lk" onclick="cl()">إغلاق</button></div><div class="card"><b>تنبيهات وتوصيات سريعة</b>${ins.length?ins.map(i=>`<div class="s">• ${esc(i.x)}<br><small>التوصية: ${esc(i.r)}</small></div>`).join(''):'<div class="s">✅ لا توجد تنبيهات حالياً في بياناتك.</div>'}</div><div id="aiChat" style="max-height:34vh;overflow:auto">${aiH.map(aiBub).join('')}</div><div class="row"><input id="aiQ" placeholder="اسأل أي سؤال: عن بياناتك أو أي موضوع آخر" onkeydown="if(event.key==='Enter')aiAsk()"><button class="b" id="aiB" onclick="aiAsk()" style="flex:0 0 auto">إرسال</button></div><small>المساعد (Gemini) يجيب عن أي سؤال، ويستخدم ملخصاً من بياناتك المعروضة لك فقط عند الحاجة. قد يخطئ؛ القرارات النهائية للجودة تظل للمسؤول. يُرسل الملخص إلى Google عبر سيرفرك.</small></div>`;$('#md').className='on';const ch=$('#aiChat');if(ch)ch.scrollTop=1e6}
async function aiAsk(){if(aiBusy)return;const q=($('#aiQ').value||'').trim();if(!q)return;const c=cfg();if(!c.url||!c.token)return toast('المساعد يحتاج إعداد المزامنة السحابية أولاً',1);if(!navigator.onLine)return toast('لا يوجد اتصال بالإنترنت',1);
  const ctx=aiCtx();aiH.push({role:'user',content:q});aiH=aiH.slice(-12);$('#aiQ').value='';aiBusy=1;const ch=$('#aiChat');ch.innerHTML=aiH.map(aiBub).join('')+'<div class="card m">⏳ جارٍ التحليل...</div>';ch.scrollTop=1e6;
  try{const r=await fx(c.url+'/api/assistant',{method:'POST',headers:{'Content-Type':'application/json','X-Sync-Token':c.token},body:JSON.stringify({messages:aiH.slice(-8),context:ctx})});
    const j=await r.json().catch(()=>({}));
    if(r.status===503)throw new Error('المساعد الذكي غير مفعّل على السيرفر بعد (يلزم إضافة GEMINI_API_KEY في Render).');
    if(r.status===401)throw new Error('مفتاح المزامنة غير صحيح.');
    if(r.status===429)throw new Error('عدد كبير من الطلبات، حاول بعد دقيقة.');
    if(!r.ok||!j.reply)throw new Error(j.error||'تعذر الحصول على رد من المساعد.');
    aiH.push({role:'assistant',content:j.reply})}
  catch(e){aiH.push({role:'assistant',content:'⚠️ '+(e.message||'تعذر الاتصال بالسيرفر.')})}
  finally{aiBusy=0;const c2=$('#aiChat');if(c2){c2.innerHTML=aiH.map(aiBub).join('');c2.scrollTop=1e6}}}

function ltEnd(id){if(!can('add'))return toast('غير مسموح لك بهذه العملية',1);const t=db.lt.find(x=>x.id===id);if(!t||t.b)return;const nt=$('#ln_'+id);if(nt)t.note=nt.value.trim();const n=new Date();t.b=n.getTime();t.sec=Math.max(0,Math.round((t.b-t.a)/1000));t.t2=hms(n);t.dur=+(t.sec/60).toFixed(2);t.s=0;aud('نهاية','lt',{no:t.car});save();R();sync();toast('تم تسجيل '+t.op+' — المدة '+fd(t.sec))}
function ltDel(id){if(!can('del'))return toast('الحذف متاح للمدير فقط',1);if(!confirm('حذف هذا السجل؟'))return;const t=db.lt.find(x=>x.id===id);aud('حذف','lt',{no:t.car});tomb('lt',id);db.lt=db.lt.filter(x=>x.id!==id);save();R();sync()}
function ltList(){const q=($('#lq')?$('#lq').value.trim().toLowerCase():''),done=db.lt.filter(t=>t.b&&(!q||JSON.stringify(Object.values(t)).toLowerCase().includes(q))).sort((a,b)=>b.b-a.b);
$('#lst').innerHTML=done.length?done.map(t=>{const g=ltg(t),rt=ltr(t);return`<div class="card"><div class="row"><b>${esc(t.car)}${t.vtype?' ('+esc(t.vtype)+')':''} — ${t.op}</b><span class="bd ${t.op==='تنزيل'?'ok':''}">${fd(t.sec)}</span></div><div class="s">${t.date} • ${t.t1} ← ${t.t2}</div>${g.n?`<div class="s">مرتبط (نفس السيارة ونفس اليوم): ${g.refs} • ${g.qty} عبوة أولية${g.kg?' • '+g.kg+' كجم':''}${rt!==''?' • المعدل <b>'+rt+' كجم/دقيقة</b>':''}</div>`:'<div class="s m">لا توجد مستندات استلام أو صرف لنفس السيارة في نفس اليوم</div>'}${t.note?`<div class="s">📝 ${esc(t.note)}</div>`:''}<div class="row"><small>${me.r==='Admin'?'👤 '+esc(t.by)+' ':''}${t.s?'':'⏳'}</small>${can('del')?`<button class="lk bad" onclick="ltDel('${t.id}')">حذف</button>`:''}</div></div>`}).join(''):'<p class="m">لا توجد عمليات مسجلة</p>'}
function lt(){const run=db.lt.filter(t=>!t.b),done=db.lt.filter(t=>t.b),add=can('add'),sm=op=>{const L=done.filter(t=>t.op===op),gs={};L.forEach(t=>{gs[nv(t.car)+t.date]=ltg(t)});const G=Object.values(gs),kg=G.reduce((a,g)=>a+g.kg,0),sc=G.filter(g=>g.kg>0).reduce((a,g)=>a+g.sec,0);return`<div class="s">${op}: ${L.length?'متوسط '+fd(Math.round(L.reduce((a,t)=>a+t.sec,0)/L.length))+' • '+L.length+' عملية'+(kg>0&&sc>0?' • معدل '+(+(kg/(sc/60)).toFixed(2))+' كجم/دقيقة':''):'—'}</div>`};
$('#mn').innerHTML=`<h2>⏱️ معدلات التحميل والتنزيل</h2><div class="card"><b>الملخص</b>${sm('تحميل')}${sm('تنزيل')}${ltBy(done)}</div>${add?`<div class="card"><label>رقم السيارة *<input id="lc" onchange="ltCar()"></label><label>نوع السيارة *<br><select id="lv"><option value="">— اختر —</option>${db.set.vtypes.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label>نوع العملية *<br><select id="lo"><option>تحميل</option><option>تنزيل</option></select></label><label>ملاحظات<input id="ln" placeholder="اختياري"></label><button class="b" style="width:100%" onclick="ltStart()">▶ بداية</button></div>`:''}${run.length?`<h2>قيد التنفيذ</h2>${run.map(t=>`<div class="card bad"><div class="row"><b>${esc(t.car)}${t.vtype?' ('+esc(t.vtype)+')':''} — ${t.op}</b><span class="bd lt-live" data-s="${t.a}">${fd(Math.max(0,Math.floor((Date.now()-t.a)/1000)))}</span></div><div class="s">بدأت ${t.t1}</div>${me.r==='Admin'?`<div class="s">👤 فتح التوقيت: <b>${esc(t.by)}</b></div>`:''}${add?`<label>ملاحظات<input id="ln_${t.id}" value="${esc(t.note||'')}" placeholder="اختياري"></label><button class="b r" style="width:100%" onclick="ltEnd('${t.id}')">■ نهاية</button>`:''}</div>`).join('')}`:''}<h2>السجل</h2><input id="lq" placeholder="بحث برقم السيارة أو نوعها..." oninput="ltList()"><div id="lst"></div>`;ltList()}
setInterval(()=>document.querySelectorAll('.lt-live').forEach(e=>e.textContent=fd(Math.max(0,Math.floor((Date.now()-+e.dataset.s)/1000)))),1000);

// ---- safe backup: export / validate / preview / apply / undo (Phase 1: no storage-model change)
const COLS=['users','temps','ncr','returns','complaints','flow','batches','ops','veh','capa','recall','prods','rcv','mvs','lt','audit'],BKL={users:'المستخدمون',temps:'قراءات الثلاجات',ncr:'عدم المطابقة',returns:'المرتجعات',complaints:'الشكاوى',flow:'سجل الحركة القديم',batches:'التشغيلات (الأصناف)',ops:'بنود الحركات',veh:'قراءات السيارات',capa:'CAPA',recall:'الاستدعاء',prods:'المنتجات',rcv:'إذونات الاستلام',mvs:'إذونات الحركة',lt:'التحميل والتنزيل',audit:'سجل التدقيق'};
let bkExp=0,BKR=null,PREV=null;
const cnt=d=>{const o={};COLS.forEach(k=>o[k]=Array.isArray(d[k])?d[k].length:0);o.units=d.set&&Array.isArray(d.set.units)?d.set.units.length:0;return o};
async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return 'sha256:'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'djb2:'+H(t)}}
async function bkBuild(w){const d=JSON.parse(JSON.stringify(db));if(!w)d.users=[];return{format:'frozenguard-backup',version:1,app:'FrozenGuard',exported_at:new Date().toISOString(),exported_by:me?me.n:'',includes_users:!!w,counts:cnt(d),checksum:await sha(JSON.stringify(d)),data:d}}
async function bkExport(w){if(!can('set'))return toast('غير مسموح',1);const env=await bkBuild(w);bkExp=1;await exp('FrozenGuard-backup-'+td()+'-'+hms(new Date()).slice(0,5).replace(':','')+'.json','application/json',JSON.stringify(env));aud('تصدير نسخة','backup',{no:w?'كاملة':'بدون مستخدمين'});save()}
async function bkValidate(text){const R={ok:false,errors:[],warnings:[],counts:null,data:null,env:null},Er=m=>R.errors.push(m),W=m=>R.warnings.push(m);let o;
try{o=JSON.parse(String(text).replace(/^\ufeff/,''))}catch(e){Er('الملف ليس JSON صالحًا');return R}
if(!o||typeof o!=='object'||Array.isArray(o)){Er('بنية الملف غير صحيحة');return R}
let d=o;if(o.format!==undefined){if(o.format!=='frozenguard-backup'){Er('الملف ليس نسخة FrozenGuard');return R}if(o.version!==1)Er('إصدار النسخة غير مدعوم: '+o.version);d=o.data;R.env=o;if(!d||typeof d!=='object'||Array.isArray(d)){Er('بيانات النسخة مفقودة');return R}
if(o.checksum){const c=await sha(JSON.stringify(d));if(c.slice(0,5)===String(o.checksum).slice(0,5)&&c!==o.checksum)Er('بصمة التحقق لا تطابق المحتوى — الملف تالف أو تم تعديله')}else W('لا توجد بصمة تحقق في الملف')}else W('نسخة بتنسيق قديم بدون بصمة تحقق');
const noUsers=R.env&&R.env.includes_users===false;
if(!noUsers&&!Array.isArray(d.users))Er('قائمة المستخدمين مفقودة');
if(!d.set||typeof d.set!=='object'||Array.isArray(d.set))Er('الإعدادات مفقودة');else if(!Array.isArray(d.set.units))Er('قائمة الثلاجات (الإعدادات) مفقودة');
COLS.filter(k=>k!=='users').forEach(k=>{if(d[k]==null)W('القسم غير موجود في الملف وسيُعتبر فارغًا: '+BKL[k]);else if(!Array.isArray(d[k]))Er('القسم ليس قائمة: '+BKL[k])});
if(R.errors.length)return R;
COLS.forEach(k=>{const seen=new Set();(d[k]||[]).forEach((x,i)=>{if(!x||typeof x!=='object'||Array.isArray(x)){Er(BKL[k]+': السجل رقم '+(i+1)+' غير صالح');return}if(k==='users'||k==='audit')return;if(!x.id||typeof x.id!=='string')Er(BKL[k]+': سجل بدون معرّف (#'+(i+1)+')');else if(seen.has(x.id))Er(BKL[k]+': معرّف مكرر '+x.id);else seen.add(x.id)})});
if(!noUsers){const u=new Set();(d.users||[]).forEach(x=>{if(!x||!x.u||!x.p||!RL[x.r])Er('مستخدم ببيانات ناقصة أو دور غير معروف: '+(x&&x.u));else if(u.has(x.u))Er('اسم مستخدم مكرر: '+x.u);else u.add(x.u)});if(!(d.users||[]).some(x=>x&&x.r==='Admin'))Er('لا يوجد مستخدم بدور مدير (Admin) في النسخة')}
const A=k=>Array.isArray(d[k])?d[k].filter(x=>x&&typeof x==='object'):[],lots=new Set(A('batches').map(b=>b.no)),mids=new Set(A('mvs').map(x=>x.id)),rids=new Set(A('rcv').map(x=>x.id)),ln=new Set();
A('batches').forEach(b=>{if(!b.no)Er('تشغيلة بدون رقم تشغيلة');else if(ln.has(b.no))Er('رقم تشغيلة مكرر: '+b.no);ln.add(b.no);if(isNaN(parseFloat(b.qty)))Er('تشغيلة '+b.no+': كمية غير رقمية')});
A('ops').forEach(o=>{if(isNaN(parseFloat(o.qty)))Er('حركة على التشغيلة '+o.batch+': كمية غير رقمية')});
const cntW=(n,m)=>n&&W(n+' '+m);
cntW(A('batches').filter(b=>b.rid&&!rids.has(b.rid)).length,'تشغيلة تشير إلى إذن استلام غير موجود');
cntW(A('ops').filter(o=>o.mid&&!mids.has(o.mid)).length,'بند حركة يشير إلى إذن حركة غير موجود');
cntW(A('ops').filter(o=>!lots.has(o.batch)).length,'بند حركة يشير إلى تشغيلة غير موجودة');
cntW(A('recall').filter(o=>!lots.has(o.batch)).length,'استدعاء يشير إلى تشغيلة غير موجودة');
const un=new Set(((d.set||{}).units||[]).map(u=>u.n));cntW(A('temps').filter(t=>!un.has(t.unit)).length,'قراءة حرارة لثلاجة غير موجودة في الإعدادات');
const bal={};A('batches').forEach(b=>bal[b.no]=parseFloat(b.qty)||0);A('ops').forEach(o=>{const q=parseFloat(o.qty)||0;if(o.batch in bal)bal[o.batch]+=o.type==='صرف'?-q:o.type==='مرتجع'||o.type==='تسوية'?q:0});cntW(Object.values(bal).filter(v=>v<-1e-9).length,'تشغيلة رصيدها سالب بعد احتساب الحركات');
cntW(COLS.reduce((a,k)=>a+A(k).filter(x=>x.cr&&isNaN(Date.parse(x.cr))).length,0),'سجل بتاريخ إنشاء غير صالح');
if(String(text).length>4e6)W('حجم الملف كبير (قد يتجاوز سعة تخزين المتصفح)');
R.data=d;R.counts=cnt(d);R.ok=R.errors.length===0;return R}
function bkTbl(a,b,la,lb){return`<div class="tb"><table><tr><th>القسم</th><th>${la}</th><th>${lb}</th><th>الفرق</th></tr>${COLS.concat(['units']).map(k=>{const x=a[k]||0,y=b[k]||0,d=y-x;return`<tr><td>${k==='units'?'الثلاجات (إعدادات)':BKL[k]}</td><td>${x}</td><td>${y}</td><td style="color:var(${d<0?'--bad':d>0?'--ok':'--m'})">${d>0?'+':''}${d}</td></tr>`}).join('')}</table></div>`}
function bkShow(R){const L=(t,a,c)=>a.length?`<div class="card ${c}"><b>${t}</b>${a.slice(0,20).map(e=>`<div class="s">• ${esc(e)}</div>`).join('')}${a.length>20?'<div class="s">… و'+(a.length-20)+' أخرى</div>':''}</div>`:'';
$('#bkr').innerHTML=(R.env?`<div class="s">النسخة بتاريخ ${esc(R.env.exported_at||'')} — ${esc(R.env.exported_by||'')}${R.env.includes_users===false?' — بدون المستخدمين (سيُحتفظ بالمستخدمين الحاليين)':''}</div>`:'')+L('أخطاء — تمنع الاستيراد',R.errors,'bad')+L('تحذيرات',R.warnings,'')+(R.data?bkTbl(cnt(db),R.counts,'الحالي','في الملف'):'')+(R.ok?`<div class="card"><label><input type="checkbox" id="bkc" style="width:auto"> حفظتُ نسخة من البيانات الحالية (تصدير) قبل الاستبدال</label><button class="b r" style="width:100%" onclick="bkApply()">استبدال البيانات الحالية بهذه النسخة</button><small>لم يتغيّر أي شيء حتى الآن. الاستبدال يتم فقط بعد الضغط هنا والتأكيد، ويُتحقق من الأعداد بعده مع تراجع تلقائي عند أي اختلاف.</small></div>`:'<p class="m">لا يمكن الاستيراد قبل إصلاح الأخطاء.</p>')}
async function bkRun(){if(!can('set'))return toast('غير مسموح',1);BKR=await bkValidate($('#bk').value);bkShow(BKR);return BKR}
function bkFile(i){const f=i.files[0];if(!f)return;f.text().then(t=>{$('#bk').value=t;bkRun()})}
async function bkApply(){if(!can('set'))return toast('غير مسموح',1);if(!BKR||!BKR.ok)return toast('افحص ملفًا صالحًا أولًا',1);const cb=$('#bkc');if(!cb||!cb.checked)return toast('أكّد أولًا أنك حفظت نسخة من البيانات الحالية',1);
const before=cnt(db),want=BKR.counts;if(!confirm('سيتم استبدال البيانات الحالية ('+Object.values(before).reduce((a,b)=>a+b,0)+' سجل) ببيانات الملف ('+Object.values(want).reduce((a,b)=>a+b,0)+' سجل). متابعة؟'))return;
const prev=JSON.stringify(db),d=JSON.parse(JSON.stringify(BKR.data));if(BKR.env&&BKR.env.includes_users===false)d.users=db.users;
const back=()=>{db=JSON.parse(prev);try{localStorage.setItem(K,prev)}catch(e){}};
try{db=d;mig();save();const st=JSON.parse(localStorage.getItem(K)),got=cnt(db),bad=[];COLS.concat(['units']).forEach(k=>{const w=k==='users'&&BKR.env&&BKR.env.includes_users===false?before.users:want[k],ok2=['rcv','mvs','users'].includes(k)?got[k]>=w:got[k]===w;if(!ok2)bad.push(BKL[k]||k)});
if(JSON.stringify(st)!==JSON.stringify(db))bad.push('التخزين المحلي لا يطابق الذاكرة');
if(bad.length){back();R();toast('فشل التحقق بعد الاستعادة ('+bad.join('، ')+') — تم التراجع تلقائيًا وإرجاع البيانات السابقة',1);BKR=null;return}
PREV=prev;aud('استعادة نسخة','backup',{no:'تحقق ناجح'});save();BKR=null;R();const af=cnt(db);if($('#bkr'))$('#bkr').innerHTML='<div class="card"><b>✅ تمت الاستعادة — تم التحقق من الأعداد</b>'+bkTbl(before,af,'قبل','بعد')+'<button class="b g" style="width:100%" onclick="bkUndo()">تراجع عن الاستعادة (متاح حتى إعادة تحميل الصفحة)</button></div>';toast('تمت الاستعادة والتحقق من الأعداد بنجاح')}
catch(e){back();R();toast('تعذّرت الاستعادة — تم إرجاع البيانات السابقة',1)}}
function bkUndo(){if(!PREV)return toast('لا توجد استعادة للتراجع عنها',1);db=JSON.parse(PREV);PREV=null;save();R();toast('تم التراجع عن الاستعادة')}

function ltCar(){const c=nv($('#lc').value),p=[...db.lt].reverse().find(t=>nv(t.car)===c&&t.vtype);if(p)$('#lv').value=p.vtype}
function ltBy(done){const T=[...new Set(done.map(t=>t.vtype).filter(Boolean))];if(!T.length)return '';return '<div class="s"><b>حسب نوع السيارة</b></div>'+T.map(v=>{const f=op=>{const L=done.filter(t=>t.vtype===v&&t.op===op);return L.length?op+' '+fd(Math.round(L.reduce((a,t)=>a+t.sec,0)/L.length))+' ('+L.length+')':''};return `<div class="s">${esc(v)}: ${[f('تحميل'),f('تنزيل')].filter(Boolean).join(' • ')}</div>`}).join('')}
function thApply(){let d=0;try{d=localStorage.getItem('fg_theme')==='dark'}catch(e){}const de=document.documentElement;if(de&&de.dataset)de.dataset.theme=d?'dark':'light';const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=d?'#0d1626':'#0f2a4a'}
function thm(){let d=0;try{d=localStorage.getItem('fg_theme')==='dark';localStorage.setItem('fg_theme',d?'light':'dark')}catch(e){}thApply()}
(function(){['mod','L','frm','rep','det','trace','bat','BL','opr','rf','mf','ML','ltList','lt','tmp','qual','vehp','aiOpen','aiCtx','insights'].forEach(n=>{try{const f=globalThis[n];if(typeof f==='function'&&!f.__v){const w=viewed(f);w.__v=1;globalThis[n]=w}}catch(e){}})})();
thApply();
rtm();
R();if(me){if(me.r!=='Admin'&&!cfgOk())syncSetup();else sync()}
</script></body></html>
